<style>
/* ===============================
   1. SETTING WARNA & FONT
   Ganti di sini kalau mau utak-atik
   =============================== */
:root {
  --bg-page: #FFFBF5;
  --card-bg: #FFFFFF;
  --text-main: #1E1E1E;
  --text-muted: #9A8C7D;
  --accent: #1E1E1E;
  --radius: 28px;
  --shadow: 0 20px 60px rgba(0,0,0,0.08);
}

/* ===============================
   2. LAYOUT DASAR
   =============================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-page);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* ===============================
   3. CARD UTAMA
   =============================== */
.card {
  width: 100%;
  max-width: 380px;
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid rgba(0,0,0,0.04);
  animation: fadeIn 0.5s ease;
}

.card__flower::after {
  content: "";
  position: absolute;
  inset: 0;
  /* Gradasi dari transparan ke putih */
  background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 30%, rgba(255,251,245,0.6) 70%, #FFFFFF 100%);
}

/* Bagian bawah - Isi Ayat */
.card__content {
  padding: 28px 28px 36px;
  text-align: center;
}
.card__ref {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 16px;
  font-weight: 500;
}
.card__text {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  line-height: 1.7;
  color: var(--text-main);
  text-wrap: balance;
  min-height: 100px;
  transition: font-size 0.3s ease;
}

/* ===============================
   4. TOMBOL
   =============================== */
.actions {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 380px;
}
.btn {
  border: none;
  border-radius: 999px;
  padding: 14px 28px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}
.btn--primary {
  background: var(--accent);
  color: white;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}
.btn--primary:active { transform: scale(0.97); }
.btn--secondary {
  background: white;
  color: var(--text-main);
  border: 1px solid rgba(0,0,0,0.08);
}
.btn--secondary:hover { background: #FAFAFA; }

.hint {
  margin-top: 20px;
  font-size: 11px;
  color: #C4B8A8;
  letter-spacing: 0.05em;
}

/* ===============================
   7. LOGIC ACAK AYAT
   =============================== */
let ayatAktif = null;

function acakAyat() {
  const card = document.getElementById('card');
  card.style.opacity = '0';
  card.style.transform = 'translateY(8px)';
  
  setTimeout(() => {
    let baru;
    do {
      baru = daftarAyat[Math.floor(Math.random() * daftarAyat.length)];
    } while (daftarAyat.length > 1 && baru === ayatAktif);
    
    ayatAktif = baru;
    document.getElementById('ref').innerText = baru.ref;
    document.getElementById('text').innerText = baru.text;
    
    // Auto adjust font size di card agar penuh tapi rapi
    autoFitCardText(baru.text);
    
    card.style.opacity = '1';
    card.style.transform = 'translateY(0)';
  }, 200);
}

function autoFitCardText(text) {
  const el = document.getElementById('text');
  // Reset
  el.style.fontSize = '22px';
  // Kalau panjang, kecilkan
  if (text.length > 180) el.style.fontSize = '18px';
  if (text.length > 250) el.style.fontSize = '16px';
  if (text.length < 80) el.style.fontSize = '26px';
}

async function shareGambar() {
  if (!ayatAktif) ayatAktif = { ref: document.getElementById('ref').innerText, text: document.getElementById('text').innerText };
  
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = 1080, H = 1080;
  
  // Load bunga
  const img = new Image();
  img.src = flowerSrc;
  await new Promise(r => img.onload = r);
  
  // 1. Background
  ctx.fillStyle = '#FFFBF5';
  ctx.fillRect(0,0,W,H);
  
  // 2. Gambar bunga atas (45%) - FIX: pakai COVER biar tidak gepeng
  const flowerH = 520;
  const drawW = W;
  const drawH = flowerH + 100;
  // hitung skala cover agar proporsi tetap, tidak gepeng
  const scale = Math.max(drawW / img.width, drawH / img.height);
  const nw = img.width * scale;
  const nh = img.height * scale;
  const dx = (drawW - nw) / 2; // center horizontal
  const dy = 0; // anchor dari atas biar bunga keliatan
  ctx.drawImage(img, dx, dy, nw, nh);
  
  // 3. Gradasi dari bunga ke bawah
  const grad = ctx.createLinearGradient(0, 220, 0, flowerH + 80);
  grad.addColorStop(0, 'rgba(255,251,245,0)');
  grad.addColorStop(0.5, 'rgba(255,251,245,0.4)');
  grad.addColorStop(1, 'rgba(255,251,245,1)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 220, W, flowerH);
  
  // 4. Tentukan font size otomatis agar penuh
  let fontSize = 56; // mulai besar
  const maxTextWidth = 880; // padding 100 kiri kanan
  const maxTextHeight = 460;
  let lines;
  
  // Cari font size yang pas
  while (fontSize > 28) {
    ctx.font = `400 ${fontSize}px "Playfair Display", Georgia, serif`;
    lines = wrapText(ctx, ayatAktif.text, maxTextWidth);
    const totalH = lines.length * (fontSize * 1.45);
    if (totalH <= maxTextHeight) break;
    fontSize -= 2;
  }
  
  // 5. Gambar Ref
  ctx.fillStyle = '#9A8C7D';
  ctx.font = '500 26px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.letterSpacing = '2px';
  const refY = 580;
  ctx.fillText(ayatAktif.ref.toUpperCase(), W/2, refY);
  
  // 6. Gambar Ayat (auto-fit)
  ctx.fillStyle = '#1E1E1E';
  ctx.font = `400 ${fontSize}px "Playfair Display", Georgia, serif`;
  ctx.textAlign = 'center';
  let y = refY + 60;
  lines.forEach(line => {
    ctx.fillText(line, W/2, y);
    y += fontSize * 1.45;
  });
  
  // 7. Watermark gereja - GANTI DI SINI
  ctx.fillStyle = 'rgba(154, 140, 125, 0.9)';
  ctx.font = '500 22px Inter, sans-serif';
  ctx.textAlign = 'center';
  // Jika teks panjang, jadi 2 baris
  const churchText1 = 'GKE Bukit Hindu,';
  const churchText2 = 'Gereja Efrata Palangka Raya';
  ctx.fillText(churchText1, W/2, H - 70);
  ctx.fillText(churchText2, W/2, H - 38);
  
  // 8. Tampilkan preview
  const dataUrl = canvas.toDataURL('image/png');
  document.getElementById('previewImg').src = dataUrl;
  document.getElementById('modal').classList.add('active');
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  let lines = [];
  let line = '';
  for (let n = 0; n < words.length; n++) {
    const test = line + words[n] + ' ';
    if (ctx.measureText(test).width > maxWidth && n > 0) {
      lines.push(line.trim());
      line = words[n] + ' ';
    } else {
      line = test;
    }
  }
  lines.push(line.trim());
  return lines;
}

function downloadGambar() {
  const canvas = document.getElementById('canvas');
  const a = document.createElement('a');
  a.download = `ayat-${ayatAktif.ref.replace(/[^a-z0-9]/gi,'-')}-1080x1080.png`;
  a.href = canvas.toDataURL();
  a.click();
}

function closeModal(e) {
  if (e.target.id === 'modal') e.target.classList.remove('active');
}

// Init pertama
acakAyat();
</script>
